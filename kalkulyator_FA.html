<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор ФА</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;margin:10px}
h2{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border:1px solid #444;padding:5px}
input{width:100%;background:#222;color:#fff;border:1px solid #555;padding:4px;box-sizing:border-box}
button{padding:6px 12px;margin:4px 2px;border:none;border-radius:6px;background:#444;color:#fff}
.del{background:#a33;padding:2px 8px}
.reset{background:#666;padding:2px 8px}
#total{font-size:22px;color:#7f7;font-weight:bold;margin:10px 0}
</style>
</head>
<body>
<h2>Калькулятор фенилаланина</h2>
Вес блюда, г: <input id="dishW" style="width:90px" type="number">
Вес порции, г: <input id="portW" style="width:90px" type="number">
<table id="tbl"><thead><tr>
<th>Продукт</th><th>ФА, мг/100 г</th><th>Вес, г</th><th>Вес в порции, г</th><th>ФА в порции, мг</th><th></th>
</tr></thead><tbody></tbody></table>
<div id="total"></div>
<button onclick="addRow()">Добавить продукт</button>
<button onclick="resetAll()">Сбросить все веса</button>
<script>
var DEF=[["Перец болгарский",63],["Помидор",26.3],["Морковь",62.5],["Лук",40],["Картофель",75],["Кабачок",20],["Укроп",125]];
var data=null,settings=null;
function load(){
 try{data=JSON.parse(localStorage.getItem("fa_prod")||"null")||null}catch(e){data=null}
 if(!data)data=DEF.map(function(p){return{n:p[0],fa:p[1],w:0}});
 try{settings=JSON.parse(localStorage.getItem("fa_set")||"null")}catch(e){settings=null}
 if(!settings)settings={dish:640,port:50};
}
function save(){
 try{localStorage.setItem("fa_prod",JSON.stringify(data));
 localStorage.setItem("fa_set",JSON.stringify(settings))}catch(e){}
}
function render(){
 var tb=document.querySelector("#tbl tbody");tb.innerHTML="";
 data.forEach(function(p,i){
  var tr=document.createElement("tr");
  var wp=settings.dish>0?p.w/settings.dish*settings.port:0;
  var fa=p.fa/100*wp;
  tr.innerHTML="<td><input value=\""+p.n.replace(/"/g,"&quot;")+"\" data-k=\"n\" data-i=\""+i+"\"></td>"+
  "<td><input type=\"number\" step=\"0.1\" value=\""+p.fa+"\" data-k=\"fa\" data-i=\""+i+"\"></td>"+
  "<td><input type=\"number\" value=\""+p.w+"\" data-k=\"w\" data-i=\""+i+"\"></td>"+
  "<td>"+wp.toFixed(2)+"</td><td>"+fa.toFixed(2)+"</td>"+
  "<td><button class='reset' onclick='resetRow("+i+")'>↺</button><button class='del' onclick='delRow("+i+")'>✕</button></td>";
  tb.appendChild(tr);
 });
 var tw=data.reduce(function(s,p){return s+ (settings.dish>0?p.w/settings.dish*settings.port:0)},0);
 var tf=data.reduce(function(s,p){return s+ p.fa/100*(settings.dish>0?p.w/settings.dish*settings.port:0)},0);
 var twt=data.reduce(function(s,p){return s+p.w},0);
 document.getElementById("total").textContent="Итого: вес "+twt.toFixed(1)+" г · в порции "+tw.toFixed(1)+" г · ФА "+tf.toFixed(2)+" мг";
 document.getElementById("dishW").value=settings.dish;
 document.getElementById("portW").value=settings.port;
}
document.addEventListener("input",function(e){
 var t=e.target;if(!t.dataset||!t.dataset.k)return;
 var i=+t.dataset.i,k=t.dataset.k;
 if(k==="n")data[i].n=t.value;
 if(k==="fa")data[i].fa=parseFloat(t.value)||0;
 if(k==="w")data[i].w=parseFloat(t.value)||0;
 settings.dish=parseFloat(document.getElementById("dishW").value)||0;
 settings.port=parseFloat(document.getElementById("portW").value)||0;
 save();render();
});
function addRow(){data.push({n:"Новый продукт",fa:0,w:0});save();render()}
function delRow(i){data.splice(i,1);save();render()}
function resetRow(i){data[i].w=0;save();render()}
function resetAll(){data.forEach(function(p){p.w=0});save();render()}
load();render();
</script>
</body>
</html>
