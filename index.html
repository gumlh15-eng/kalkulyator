<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор фенилаланина</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0d0d12;color:#e8e8ee;font-family:sans-serif;padding:16px}
h1{font-size:24px;margin:0 0 14px}
.field{margin:8px 0}
.field label{display:inline-block;min-width:180px;color:#bbb}
.field input{width:110px;background:#1c1c24;color:#eee;border:1px solid #3a3a45;border-radius:6px;padding:6px 10px;font-size:16px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;margin-top:14px;min-width:760px}
th{font-size:13px;color:#9aa3b5;font-weight:normal;padding:4px 6px;text-align:center;white-space:nowrap}
td{padding:3px}
td input{width:100%;background:#1c1c24;color:#eee;border:1px solid #3a3a45;border-radius:5px;padding:6px 8px;font-size:15px}
td.num input{text-align:right}
td.c{text-align:right;color:#cfd6e4;padding:0 8px;white-space:nowrap}
td.ic{white-space:nowrap}
button{background:#2a2a35;color:#eee;border:1px solid #454552;border-radius:6px;padding:9px 14px;font-size:15px;cursor:pointer}
button:hover{background:#343444}
td button{padding:5px 9px;background:#20202a;border-color:#3a3a45}
.res{color:#4caf50;font-weight:bold;font-size:18px;margin-top:16px}
.res2{margin-top:6px}
.note{color:#999;font-size:14px;margin-top:6px}
.btns{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
#msg{color:#7de07d;margin-top:12px;min-height:22px;font-size:14px}
#dl{display:none}
</style>
</head>
<body>
<h1>Калькулятор фенилаланина</h1>
<div class="field"><label>Вес готового блюда, г</label><input type="number" id="dishW" step="any" inputmode="decimal"></div>
<div class="field"><label>Вес порции, г</label><input type="number" id="portW" step="any" inputmode="decimal"></div>
<div class="tblwrap">
<table id="tbl">
<thead><tr><th>Продукт</th><th>ФА, мг/100 г</th><th>Вес, г</th><th>Вес в порции, г</th><th>ФА в порции, мг</th><th></th></tr></thead>
<tbody id="tb"></tbody>
</table>
</div>
<div class="res" id="line1"></div>
<div class="res2" id="line2"></div>
<div class="note" id="note"></div>
<div class="btns">
<button id="add">Добавить продукт</button>
<button id="clearW">Сбросить все веса</button>
<button id="share">Поделиться</button>
<button id="shot">Скриншот рецепта</button>
</div>
<div id="msg"></div>
<a id="dl"></a>
<script>
(function(){
var tb=document.getElementById('tb');
var dishW=document.getElementById('dishW'),portW=document.getElementById('portW');
var line1=document.getElementById('line1'),line2=document.getElementById('line2');
var note=document.getElementById('note'),msg=document.getElementById('msg');
var dl=document.getElementById('dl');

function fmt(x,d){
 if(!isFinite(x))x=0;
 return x.toFixed(d===undefined?2:d);
}

function addRow(p,fa,w){
 var tr=document.createElement('tr');
 function td(cls){var c=document.createElement('td');if(cls)c.className=cls;tr.appendChild(c);return c;}
 var c1=td(),c2=td('num'),c3=td('num'),c4=td('c'),c5=td('c'),c6=td('ic');
 var iP=document.createElement('input');iP.className='inP';iP.placeholder='Продукт';
 var iF=document.createElement('input');iF.className='inF';iF.type='number';iF.step='any';iF.placeholder='0';
 var iW=document.createElement('input');iW.className='inW';iW.type='number';iW.step='any';iW.placeholder='0';
 c1.appendChild(iP);c2.appendChild(iF);c3.appendChild(iW);
 if(p!==undefined)iP.value=p;
 if(fa!==undefined)iF.value=fa;
 if(w!==undefined)iW.value=w;
 var oW=document.createElement('span');oW.className='outW';
 var oF=document.createElement('span');oF.className='outF';
 c4.appendChild(oW);c5.appendChild(oF);
 var bU=document.createElement('button');bU.textContent='↺';bU.title='Сбросить строку';
 var bD=document.createElement('button');bD.textContent='✕';bD.title='Удалить строку';
 c6.appendChild(bU);c6.appendChild(document.createTextNode(' '));c6.appendChild(bD);
 bU.addEventListener('click',function(){iP.value='';iF.value='';iW.value='';calc();save();});
 bD.addEventListener('click',function(){
  tr.remove();
  if(!tb.children.length)addRow();
  calc();save();
 });
 tb.appendChild(tr);
}

function calc(){
 var dw=parseFloat(dishW.value)||0,pw=parseFloat(portW.value)||0;
 var k=dw>0?pw/dw:0;
 var sumW=0,sumFA=0,sumFP=0;
 for(var i=0;i<tb.children.length;i++){
  var tr=tb.children[i];
  var fa=parseFloat(tr.querySelector('.inF').value)||0;
  var w=parseFloat(tr.querySelector('.inW').value)||0;
  var wp=w*k,fp=w*fa/100*k;
  sumW+=w;sumFA+=w*fa/100;sumFP+=fp;
  tr.querySelector('.outW').textContent=fmt(wp);
  tr.querySelector('.outF').textContent=fmt(fp);
 }
 line1.textContent='ФА в порции'+(pw>0?' ('+fmt(pw,pw%1?1:0)+' г)':'')+': '+fmt(sumFP)+' мг';
 line2.textContent='ФА на 100 г готового продукта: '+fmt(dw>0?sumFA/dw*100:0)+' мг';
 note.textContent='Справочно: сырых ингредиентов '+fmt(sumW,1)+' г · в порции '+fmt(sumW*k,1)+' г · ФА во всём блюде '+fmt(sumFA,1)+' мг';
}

function save(){
 var data={dw:dishW.value,pw:portW.value,rows:[]};
 for(var i=0;i<tb.children.length;i++){
  var tr=tb.children[i];
  data.rows.push({
   p:tr.querySelector('.inP').value,
   f:tr.querySelector('.inF').value,
   w:tr.querySelector('.inW').value
  });
 }
 try{localStorage.setItem('fa_calc',JSON.stringify(data));}catch(e){}
}

function load(){
 var d=null;
 try{d=JSON.parse(localStorage.getItem('fa_calc')||'null');}catch(e){}
 if(d&&d.rows&&d.rows.length){
  dishW.value=d.dw||'';portW.value=d.pw||'';
  d.rows.forEach(function(r){addRow(r.p,r.f,r.w);});
 }else{
  addRow();
 }
}

function summary(){
 var trs=tb.children;
 var lines=['Калькулятор фенилаланина',
  'Вес готового блюда: '+(dishW.value||'0')+' г, порция: '+(portW.value||'0')+' г',''];
 for(var i=0;i<trs.length;i++){
  var p=trs[i].querySelector('.inP').value.trim();
  var w=parseFloat(trs[i].querySelector('.inW').value)||0;
  if(!p&&!w)continue;
  var fa=parseFloat(trs[i].querySelector('.inF').value)||0;
  lines.push('- '+p+' - '+w+' г (ФА '+fa+' мг/100 г)');
 }
 lines.push('',line1.textContent,line2.textContent,note.textContent);
 return lines.join('\n');
}

function fallbackCopy(t){
 var ta=document.createElement('textarea');
 ta.value=t;document.body.appendChild(ta);ta.select();
 try{document.execCommand('copy');msg.textContent='Текст скопирован - вставьте куда нужно';}
 catch(e){msg.textContent='Не получилось скопировать';}
 ta.remove();
}

document.getElementById('share').addEventListener('click',function(){
 var text=summary();
 if(navigator.share){
  navigator.share({title:'Расчёт ФА',text:text}).catch(function(){});
 }else if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(text).then(function(){
   msg.textContent='Текст скопирован - вставьте куда нужно';
  }).catch(function(){fallbackCopy(text);});
 }else fallbackCopy(text);
});

function drawCard(){
 var rows=[];
 for(var i=0;i<tb.children.length;i++){
  var tr=tb.children[i];
  var p=tr.querySelector('.inP').value.trim();
  var fa=tr.querySelector('.inF').value;
  var w=tr.querySelector('.inW').value;
  if(!p&&!fa&&!w)continue;
  rows.push({p:p||'-',fa:fa||'0',w:w||'0',
   wp:tr.querySelector('.outW').textContent,
   fp:tr.querySelector('.outF').textContent});
 }
 var s=2,W=1000,H=300+rows.length*42+150;
 var c=document.createElement('canvas');
 c.width=W*s;c.height=H*s;
 var x=c.getContext('2d');x.scale(s,s);
 x.fillStyle='#14141c';x.fillRect(0,0,W,H);
 var d=new Date();
 x.fillStyle='#e8e8ee';x.font='bold 34px sans-serif';
 x.fillText('Калькулятор фенилаланина',40,60);
 x.fillStyle='#999';x.font='16px sans-serif';
 x.fillText(d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})+', '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),40,90);
 x.fillStyle='#bbb';x.font='18px sans-serif';
 x.fillText('Вес готового блюда: '+(dishW.value||'-')+' г',40,132);
 x.fillText('Вес порции: '+(portW.value||'-')+' г',400,132);
 var y=178;
 x.fillStyle='#8899aa';x.font='bold 15px sans-serif';
 x.textAlign='left';x.fillText('Продукт',40,y);
 x.textAlign='right';
 x.fillText('ФА, мг/100 г',530,y);
 x.fillText('Вес, г',640,y);
 x.fillText('Вес в порции, г',780,y);
 x.fillText('ФА в порции, мг',960,y);
 x.textAlign='left';
 y+=10;x.strokeStyle='#33334a';x.beginPath();x.moveTo(40,y);x.lineTo(960,y);x.stroke();
 y+=32;
 rows.forEach(function(r){
  x.fillStyle='#e8e8ee';x.font='17px sans-serif';
  var name=r.p.length>32?r.p.slice(0,31)+'...':r.p;
  x.textAlign='left';x.fillText(name,40,y);
  x.textAlign='right';
  x.fillText(r.fa,530,y);
  x.fillText(r.w,640,y);
  x.fillText(r.wp,780,y);
  x.fillStyle='#7de07d';
  x.fillText(r.fp,960,y);
  x.textAlign='left';
  y+=42;
 });
 y+=14;
 x.fillStyle='#4caf50';x.font='bold 22px sans-serif';
 x.fillText(line1.textContent,40,y);y+=36;
 x.fillStyle='#e8e8ee';x.font='17px sans-serif';
 x.fillText(line2.textContent,40,y);y+=32;
 x.fillStyle='#999';x.font='15px sans-serif';
 x.fillText(note.textContent,40,y);y+=44;
 x.fillStyle='#666';x.font='13px sans-serif';
 x.fillText('Рассчитано в калькуляторе фенилаланина',40,y);
 return c;
}

document.getElementById('shot').addEventListener('click',function(){
 var c=drawCard();
 c.toBlob(function(b){
  if(!b){msg.textContent='Не удалось создать изображение';return;}
  var f=null;
  try{f=new File([b],'fa_recept.png',{type:'image/png'});}catch(e){}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
   navigator.share({files:[f],title:'Расчёт ФА'}).catch(function(){});
  }else{
   dl.href=URL.createObjectURL(b);
   dl.download='fa_recept.png';
   dl.click();
   msg.textContent='Скриншот рецепта сохранён в Загрузки';
  }
 },'image/png');
});

document.getElementById('clearW').addEventListener('click',function(){
 for(var i=0;i<tb.children.length;i++)tb.children[i].querySelector('.inW').value='0';
 calc();save();
 msg.textContent='Веса сброшены';
});

document.getElementById('add').addEventListener('click',function(){
 addRow();calc();save();
 var last=tb.children[tb.children.length-1];
 last.querySelector('.inP').focus();
});

dishW.addEventListener('input',function(){calc();save();});
portW.addEventListener('input',function(){calc();save();});
tb.addEventListener('input',function(){calc();save();});

load();calc();
})();
</script>
</body>
</html>
